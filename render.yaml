web:
  env: python
  buildCommand: pip install -r requirements.txt
  startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
  envVars:
    - key: SECRET_KEY
      generateValue: true
    - key: TMDB_API_KEY
      sync: false
    - key: GEMINI_API_KEY
      sync: false
    - key: YOUTUBE_API_KEY
      sync: false
    - key: SESSION_COOKIE_SECURE
      value: "true"
    - key: TRUST_PROXY_HEADERS
      value: "true"
