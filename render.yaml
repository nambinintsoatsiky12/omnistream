services:
  - type: web
    name: omnistream
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 8 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: TMDB_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      # Facultatif : sans cette cle, la source MP3 reste sur Internet Archive.
      - key: JAMENDO_CLIENT_ID
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
