{% extends "base.html" %}
{% block title %}Musique — OmniStream{% endblock %}
{% block content %}

<div style="max-width: 900px; margin: 0 auto; padding: 20px;">
  <h1 class="search-title" style="margin-bottom: 6px;">🎧 Musique</h1>
  <p style="color: #999; margin-bottom: 20px;">Cherchez un artiste ou un titre, écoutez directement ici.</p>

  <form id="musique-search-form" style="display: flex; gap: 10px; margin-bottom: 24px;">
    <input type="text" id="musique-search-input" placeholder="Rechercher un artiste, un titre..."
           style="flex: 1; padding: 12px 16px; border-radius: 10px; border: 1px solid #333; background: #14141c; color: #fff; font-size: 15px;">
    <button type="submit" style="padding: 12px 20px; border-radius: 10px; border: none; background: linear-gradient(45deg, #ff8c00, #ff3d7f); color: #fff; font-weight: 700;">Rechercher</button>
  </form>

  <div id="musique-player-wrap" style="display:none; margin-bottom: 24px;">
    <div style="position: relative; padding-top: 56.25%; border-radius: 12px; overflow: hidden;">
      <iframe id="musique-player" style="position: absolute; top:0; left:0; width:100%; height:100%; border:0;"
        src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <div id="musique-results" class="grid"></div>
  <p id="musique-empty" class="empty" hidden>Aucun résultat trouvé.</p>
  <p id="musique-loading" class="empty" hidden>Recherche en cours...</p>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/musique.js') }}"></script>
{% endblock %}
