{% extends "base.html" %}
{% block title %}Musique — OmniStream{% endblock %}
{% block content %}

<div style="max-width: 1200px; margin: 0 auto; padding: 20px 0;">
  <h1 class="search-title" style="padding-left: 0; margin-bottom: 8px;">🎧 Musique</h1>
  <p style="color: var(--muted); margin-bottom: 20px; font-size: 0.95rem;">Cherchez un artiste ou un titre, écoutez ou regardez en plein écran.</p>

  <!-- Mode Toggle -->
  <div class="mode-toggle" id="mode-toggle">
    <button type="button" class="mode-btn active" data-mode="audio">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
      Audio
    </button>
    <button type="button" class="mode-btn" data-mode="video">
      <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
      Vidéo
    </button>
  </div>

  <!-- Search -->
  <form id="musique-search-form" style="display: flex; gap: 10px; margin-bottom: 28px;">
    <input type="text" id="musique-search-input" placeholder="Rechercher un artiste, un titre..." maxlength="120" aria-label="Artiste ou titre"
           style="flex: 1; padding: 14px 20px; border-radius: 28px; border: 1px solid var(--border); background: var(--surface); color: var(--text-bright); font-size: 0.95rem; transition: border-color 0.2s;">
    <button type="submit" style="padding: 14px 28px; border-radius: 28px; border: none; background: linear-gradient(135deg, #8b5cf6, #ec4899, #fb923c); color: #fff; font-weight: 800; cursor: pointer; font-size: 0.9rem; letter-spacing: 0.3px; transition: all 0.2s;">Rechercher</button>
  </form>

  <!-- Audio mode : iframe YouTube caché (1px) + barre de lecteur -->
  <div class="audio-hidden-frame" aria-hidden="true">
    <iframe id="musique-player" src="about:blank" title="Lecteur audio" tabindex="-1"
      referrerpolicy="strict-origin-when-cross-origin"
      allow="autoplay; encrypted-media"></iframe>
  </div>

  <h2 id="musique-section-title" class="search-title" style="font-size: 1.15rem; padding-left: 0; margin-bottom: 16px;"></h2>
  <div id="musique-results" class="grid"></div>
  <p id="musique-empty" class="empty" hidden>Aucun résultat trouvé.</p>
  <p id="musique-loading" class="empty" hidden>Chargement...</p>
</div>

<!-- Barre de lecteur audio (mode Audio) -->
<div id="audio-bar" class="audio-bar" hidden>
  <div class="audio-bar-disc" id="audio-bar-disc" aria-hidden="true">
    <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3v10.55c-.59-.34-1.27-.55-2-.55C7.79 13 6 14.79 6 17s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/></svg>
  </div>
  <div class="audio-bar-meta">
    <div class="audio-bar-title" id="audio-bar-title">—</div>
    <div class="audio-bar-channel" id="audio-bar-channel"></div>
  </div>
  <div class="audio-bar-eq" id="audio-bar-eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <button type="button" class="audio-bar-stop" id="audio-bar-stop" aria-label="Arrêter la lecture">
    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M6 6h12v12H6z"/></svg>
  </button>
</div>

<!-- Overlay vidéo vrai plein écran (mode Vidéo) -->
<div id="video-overlay" class="video-overlay">
  <button type="button" class="video-close" id="video-close" aria-label="Fermer">&times;</button>
  <iframe id="video-fullscreen-player" class="video-fullscreen-frame" src="about:blank" title="Lecteur vidéo" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
  <div class="video-title" id="video-title"></div>
</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/musique.js') }}?v=4"></script>
{% endblock %}
