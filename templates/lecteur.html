{% extends "base.html" %}
{% block title %}Lecteur Scan — {{ titre }} — OmniStream{% endblock %}
{% block content %}
<div id="scan-reader-root" data-title="{{ titre | tojson }}" style="max-width: 900px; margin: 0 auto; padding: 20px;">
  <h1 class="search-title" style="padding-left: 0; margin-bottom: 16px;">📖 {{ titre }}</h1>
  <div id="scan-controls" style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center;">
    <input type="text" id="scan-search" placeholder="Chapitre..." style="padding: 10px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-bright); font-size: 0.9rem; max-width: 200px;">
    <select id="scan-lang" style="padding: 10px 16px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text-bright); font-size: 0.9rem;">
      <option value="fr">Français</option>
      <option value="en">English</option>
    </select>
    <button id="scan-load" style="padding: 10px 20px; border-radius: 20px; border: none; background: linear-gradient(135deg, #8b5cf6, #ec4899, #fb923c); color: #fff; font-weight: 700; cursor: pointer;">Charger</button>
  </div>
  <div id="scan-status" style="color: var(--muted); margin-bottom: 16px;"></div>
  <div id="scan-pages" style="display: flex; flex-direction: column; gap: 8px; align-items: center;"></div>
  <div id="scan-nav" style="display: flex; gap: 10px; justify-content: center; margin-top: 20px;" hidden>
    <button id="scan-prev" style="padding: 10px 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-weight: 600;">← Précédent</button>
    <span id="scan-chapter-label" style="display: flex; align-items: center; color: var(--muted); font-weight: 600;"></span>
    <button id="scan-next" style="padding: 10px 20px; border-radius: 20px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; font-weight: 600;">Suivant →</button>
  </div>
</div>
{% endblock %}
{% block scripts %}
<script>
(function(){
  "use strict";
  const root = document.getElementById("scan-reader-root");
  if (!root) return;
  const title = root.dataset.title || "";
  const searchInput = document.getElementById("scan-search");
  const langSelect = document.getElementById("scan-lang");
  const loadBtn = document.getElementById("scan-load");
  const statusEl = document.getElementById("scan-status");
  const pagesEl = document.getElementById("scan-pages");
  const navEl = document.getElementById("scan-nav");
  const prevBtn = document.getElementById("scan-prev");
  const nextBtn = document.getElementById("scan-next");
  const labelEl = document.getElementById("scan-chapter-label");

  let mangaId = null;
  let chapters = [];
  let currentChapter = 0;

  async function api(endpoint, params) {
    const qs = new URLSearchParams({ endpoint, ...params });
    const r = await fetch(`/api/mangadex_proxy?${qs}`);
    if (!r.ok) throw new Error("Erreur API");
    return r.json();
  }

  async function searchManga() {
    statusEl.textContent = "Recherche du manga...";
    const data = await api("/manga", { title, "limit": "5", "contentRating[]": "safe" });
    const results = (data.data || []).filter(m => m.attributes && m.attributes.title);
    if (!results.length) { statusEl.textContent = "Manga introuvable."; return; }
    mangaId = results[0].id;
    const mangaTitle = results[0].attributes.title.fr || results[0].attributes.title.en || title;
    statusEl.textContent = `Trouvé : ${mangaTitle}`;
    await loadChapters();
  }

  async function loadChapters() {
    if (!mangaId) return;
    const lang = langSelect.value;
    statusEl.textContent = "Chargement des chapitres...";
    const data = await api(`/manga/${mangaId}/feed`, {
      "translatedLanguage[]": lang,
      "order[chapter]": "asc",
      "limit": "500",
      "contentRating[]": "safe"
    });
    chapters = (data.data || []).filter(c => c.attributes && c.attributes.chapter);
    if (!chapters.length) { statusEl.textContent = "Aucun chapitre trouvé."; navEl.hidden = true; return; }
    currentChapter = 0;
    navEl.hidden = false;
    await renderChapter();
  }

  async function renderChapter() {
    const ch = chapters[currentChapter];
    if (!ch) return;
    const chNum = ch.attributes.chapter || "?";
    labelEl.textContent = `Chapitre ${chNum} / ${chapters.length}`;
    statusEl.textContent = `Chapitre ${chNum} — Chargement des pages...`;
    pagesEl.replaceChildren();

    const serverData = await api(`/at-home/server/${ch.id}`);
    const baseUrl = serverData.baseUrl;
    const hash = serverData.chapter.hash;
    const pages = serverData.chapter.data || [];

    pagesEl.replaceChildren(...pages.map(filename => {
      const img = document.createElement("img");
      img.src = `${baseUrl}/data/${hash}/${filename}`;
      img.alt = `Page`;
      img.loading = "lazy";
      img.style.cssText = "max-width:100%; border-radius:8px;";
      return img;
    }));
    statusEl.textContent = `Chapitre ${chNum} — ${pages.length} pages`;
  }

  loadBtn.addEventListener("click", () => { mangaId = null; chapters = []; pagesEl.replaceChildren(); navEl.hidden = true; searchManga().catch(e => { statusEl.textContent = e.message; }); });
  prevBtn.addEventListener("click", () => { if (currentChapter > 0) { currentChapter--; renderChapter(); } });
  nextBtn.addEventListener("click", () => { if (currentChapter < chapters.length - 1) { currentChapter++; renderChapter(); } });

  searchManga().catch(e => { statusEl.textContent = e.message; });
})();
</script>
{% endblock %}
