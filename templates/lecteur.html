{% extends "base.html" %}
{% block title %}Lecteur de Scan — {{ titre }} — OmniStream{% endblock %}
{% block content %}
<div class="scan-reader-container" id="scan-reader-root" data-title="{{ titre | tojson }}">
  <div class="scan-header-bar">
    <div class="scan-title-group">
      <div class="section-kicker orange">LECTEUR MANGA VF</div>
      <h1 class="scan-title">{{ titre }}</h1>
    </div>

    <!-- CONTROLS -->
    <div class="scan-toolbar">
      <select id="scan-lang" class="scan-select" aria-label="Langue des scans">
        <option value="fr">🇫🇷 Version Française (VF)</option>
        <option value="en">🇬🇧 English (VA)</option>
      </select>
      <button id="scan-load" class="scan-action-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        <span>Recharger</span>
      </button>
    </div>
  </div>

  <div id="scan-status" class="scan-status-indicator">Initialisation du lecteur MangaDex...</div>

  <!-- CHAPTER NAVIGATION BAR -->
  <div id="scan-nav-top" class="scan-nav-bar" hidden>
    <button id="scan-prev" class="scan-nav-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>Précédent</span>
    </button>
    <span id="scan-chapter-label" class="scan-chapter-label"></span>
    <button id="scan-next" class="scan-nav-btn">
      <span>Suivant</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>

  <!-- PAGES CONTAINER -->
  <div id="scan-pages" class="scan-pages-flow"></div>

  <!-- BOTTOM CHAPTER NAVIGATION -->
  <div id="scan-nav" class="scan-nav-bar" hidden>
    <button id="scan-prev-bottom" class="scan-nav-btn">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"></polyline></svg>
      <span>Chapitre Précédent</span>
    </button>
    <button id="scan-next-bottom" class="scan-nav-btn primary">
      <span>Chapitre Suivant</span>
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"></polyline></svg>
    </button>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
(function(){
  "use strict";
  const root = document.getElementById("scan-reader-root");
  if (!root) return;
  const title = root.dataset.title || "";
  const langSelect = document.getElementById("scan-lang");
  const loadBtn = document.getElementById("scan-load");
  const statusEl = document.getElementById("scan-status");
  const pagesEl = document.getElementById("scan-pages");
  const navTop = document.getElementById("scan-nav-top");
  const navBottom = document.getElementById("scan-nav");
  const prevBtn = document.getElementById("scan-prev");
  const nextBtn = document.getElementById("scan-next");
  const prevBtnBottom = document.getElementById("scan-prev-bottom");
  const nextBtnBottom = document.getElementById("scan-next-bottom");
  const labelEl = document.getElementById("scan-chapter-label");

  let mangaId = null;
  let chapters = [];
  let currentChapter = 0;

  async function api(endpoint, params) {
    const qs = new URLSearchParams({ endpoint, ...params });
    const r = await fetch(`/api/mangadex_proxy?${qs}`);
    if (!r.ok) throw new Error("Erreur de communication avec MangaDex.");
    return r.json();
  }

  async function searchManga() {
    statusEl.innerHTML = `<span class="spinner-small"></span> Recherche de l'œuvre originale sur MangaDex...`;
    const data = await api("/manga", { title, "limit": "5", "contentRating[]": "safe" });
    const results = (data.data || []).filter(m => m.attributes && m.attributes.title);
    if (!results.length) {
      statusEl.textContent = "Aucun scan trouvé pour ce titre. Essayez avec le nom original du manga.";
      return;
    }
    mangaId = results[0].id;
    const mangaTitle = results[0].attributes.title.fr || results[0].attributes.title.en || title;
    statusEl.textContent = `Manga identifié : ${mangaTitle}`;
    await loadChapters();
  }

  async function loadChapters() {
    if (!mangaId) return;
    const lang = langSelect ? langSelect.value : "fr";
    statusEl.innerHTML = `<span class="spinner-small"></span> Chargement des chapitres disponibles...`;
    const data = await api(`/manga/${mangaId}/feed`, {
      "translatedLanguage[]": lang,
      "order[chapter]": "asc",
      "limit": "500",
      "contentRating[]": "safe"
    });
    chapters = (data.data || []).filter(c => c.attributes && c.attributes.chapter);
    if (!chapters.length) {
      statusEl.textContent = "Aucun chapitre disponible dans cette langue.";
      if (navTop) navTop.hidden = true;
      if (navBottom) navBottom.hidden = true;
      return;
    }
    currentChapter = 0;
    if (navTop) navTop.hidden = false;
    if (navBottom) navBottom.hidden = false;
    await renderChapter();
  }

  async function renderChapter() {
    const ch = chapters[currentChapter];
    if (!ch) return;
    const chNum = ch.attributes.chapter || "?";
    if (labelEl) labelEl.textContent = `Chapitre ${chNum} (${currentChapter + 1} / ${chapters.length})`;
    statusEl.innerHTML = `<span class="spinner-small"></span> Chargement des planches du Chapitre ${chNum}...`;
    pagesEl.replaceChildren();

    try {
      const serverData = await api(`/at-home/server/${ch.id}`);
      const baseUrl = serverData.baseUrl;
      const hash = serverData.chapter.hash;
      const pages = serverData.chapter.data || [];

      pagesEl.replaceChildren(...pages.map((filename, i) => {
        const wrap = document.createElement("div");
        wrap.className = "scan-page-wrap";
        const img = document.createElement("img");
        img.src = `${baseUrl}/data/${hash}/${filename}`;
        img.alt = `Planche ${i + 1}`;
        img.loading = "lazy";
        img.className = "scan-page-img";
        wrap.appendChild(img);
        return wrap;
      }));
      statusEl.textContent = `Chapitre ${chNum} prêt (${pages.length} pages)`;
    } catch(err) {
      statusEl.textContent = "Erreur lors du chargement des images de ce chapitre.";
    }
  }

  function goPrev() {
    if (currentChapter > 0) {
      currentChapter--;
      renderChapter();
      window.scrollTo({ top: 120, behavior: "smooth" });
    }
  }

  function goNext() {
    if (currentChapter < chapters.length - 1) {
      currentChapter++;
      renderChapter();
      window.scrollTo({ top: 120, behavior: "smooth" });
    }
  }

  if (loadBtn) loadBtn.addEventListener("click", () => {
    mangaId = null;
    chapters = [];
    pagesEl.replaceChildren();
    if (navTop) navTop.hidden = true;
    if (navBottom) navBottom.hidden = true;
    searchManga().catch(e => { statusEl.textContent = e.message; });
  });

  if (langSelect) langSelect.addEventListener("change", () => {
    loadChapters().catch(e => { statusEl.textContent = e.message; });
  });

  if (prevBtn) prevBtn.addEventListener("click", goPrev);
  if (nextBtn) nextBtn.addEventListener("click", goNext);
  if (prevBtnBottom) prevBtnBottom.addEventListener("click", goPrev);
  if (nextBtnBottom) nextBtnBottom.addEventListener("click", goNext);

  searchManga().catch(e => { statusEl.textContent = e.message; });
})();
</script>
{% endblock %}
