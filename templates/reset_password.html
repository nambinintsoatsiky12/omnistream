{% extends "base.html" %}
{% block title %}Nouveau mot de passe — OmniStream{% endblock %}
{% block content %}
<div class="auth-box">
  <div class="auth-header">
    <span class="auth-logo">OMNI<span>STREAM</span></span>
    <h1>Choisir un nouveau mot de passe</h1>
  </div>

  {% if error %}
    <div class="auth-error">{{ error }}</div>
  {% endif %}

  <form method="post" action="{{ url_for('reset_password', token=token) }}" class="auth-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="auth-field">
      <label for="password">Nouveau mot de passe</label>
      <input type="password" id="password" name="password" required autocomplete="new-password" minlength="8" maxlength="128">
    </div>
    <div class="auth-field">
      <label for="password_confirm">Confirmer le mot de passe</label>
      <input type="password" id="password_confirm" name="password_confirm" required autocomplete="new-password" minlength="8" maxlength="128">
    </div>

    <button type="submit" class="auth-submit">Changer le mot de passe</button>
  </form>
</div>
{% endblock %}
